<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#fff;color:#12203A;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
svg{width:100%;height:auto;display:block}
.edge{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.dashed{stroke-dasharray:7 6}
.c-orange{stroke:#E8862A;marker-end:url(#m-orange)}
.c-red{stroke:#D13B3B;marker-end:url(#m-red)}
.c-blue{stroke:#3F5FBF;marker-end:url(#m-blue)}
.c-green{stroke:#2E8B3E;marker-end:url(#m-green)}
.c-teal{stroke:#0B6E5F;marker-end:url(#m-teal)}
.c-purple{stroke:#7A3E9D;marker-end:url(#m-purple)}
.bi.c-orange{marker-start:url(#m-orange)}
.bi.c-red{marker-start:url(#m-red)}
.bi.c-blue{marker-start:url(#m-blue)}
.bi.c-green{marker-start:url(#m-green)}
.bi.c-teal{marker-start:url(#m-teal)}
.bi.c-purple{marker-start:url(#m-purple)}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible .shape{stroke:#12203A;stroke-width:3.5}
.node.sel .shape{stroke:#12203A;stroke-width:3.5}
[data-flows]{transition:opacity .2s}
.dim{opacity:.13}
.core-pill.dim{opacity:.25}
.core-pill rect{transition:stroke .2s,stroke-width .2s}
.core-pill.pill-active rect{stroke-width:1.8}
.core-off .core-el{display:none}
.core-off .edge.bi{marker-start:none}
.core-off .bi-dot{display:none}
.no-anim .dot{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:0 0 8px}
.bar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .lbl{font-size:13px;font-weight:700;color:#2F4FA0;text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.bar button{-webkit-appearance:none;appearance:none;font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;border:1.5px solid #C9D1DE;background:#fff;color:#12203A;cursor:pointer;min-height:44px}
.bar button[aria-pressed="true"]{background:#12203A;color:#fff;border-color:#12203A}
.bar .step[aria-pressed="true"]{background:#0B6E5F;border-color:#0B6E5F}
.bar button:focus-visible,.bar input:focus-visible+span{outline:3px solid #3F5FBF;outline-offset:2px}
.bar label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;min-height:44px;padding:0 6px;cursor:pointer}
.bar input{width:20px;height:20px;accent-color:#0B6E5F}
.sep{width:1px;height:28px;background:#C9D1DE;margin:0 4px}
#info{margin-top:10px;border:1.5px solid #C9D1DE;border-radius:10px;padding:14px 18px;min-height:150px;background:#F6F7FA}
#info h2{margin:0 0 4px;font-size:17px}
#info p{margin:0 0 6px;font-size:15px;line-height:1.5;color:#3B4658}
#info ul{margin:8px 0 0;padding-left:20px;font-size:15px;line-height:1.55;color:#12203A;columns:2;column-gap:36px}
#info li{break-inside:avoid;margin-bottom:2px}
#info .note{font-style:italic}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:8px;white-space:nowrap}
.badge.avail{background:#DDF1E2;color:#1B5E2C}
.badge.dev{background:#FFE9C7;color:#7A4A00}
.chips{display:flex;flex-wrap:wrap;gap:10px 22px;margin:10px 0 2px}
.chips div{font-size:14px;color:#3B4658;max-width:330px}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;font-size:13px;font-weight:700;margin-right:8px}
.chip.m{background:#DDF1E2;color:#1B5E2C}
.chip.f{background:#FFE9C7;color:#7A4A00}
.chip.n{background:#E6E9EF;color:#3B4658}
.sample{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:8px;font-size:15px;line-height:1.5}
.sample b{color:#12203A}
.sample span{color:#3B4658}
.fine{font-size:13px;color:#5A6577;margin-top:8px}
.controls-wrap{display:flex;flex-direction:column;gap:0}
.svg-stage{position:relative;width:100%;background:#fff;border-radius:10px;overflow:hidden;touch-action:pan-y}
.svg-stage.zoomed{touch-action:none}
.svg-stage.is-dragging{cursor:grabbing}
.zoom-hud{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;align-items:center;z-index:10;background:#ffffff;padding:4px;border-radius:999px;border:1.5px solid #C9D1DE;box-shadow:0 2px 8px rgba(18,32,58,.10)}
.zoom-hud button{-webkit-appearance:none;appearance:none;font:inherit;font-size:13px;font-weight:700;min-width:36px;height:36px;padding:0 10px;border-radius:999px;border:1px solid #C9D1DE;background:#fff;color:#12203A;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.zoom-hud button:active{background:#12203A;color:#fff}
.zoom-hud button:focus-visible{outline:3px solid #3F5FBF;outline-offset:2px}
.touch-hint{display:none;position:absolute;left:10px;bottom:12px;font-size:11.5px;font-weight:600;color:#5A6577;background:rgba(246,247,250,.92);padding:4px 10px;border-radius:999px;border:1px solid #D8DFE9;pointer-events:none;z-index:9}
.main-split{display:block}
@media (max-width:900px){
 .wrap{padding:10px max(10px,env(safe-area-inset-right)) 14px max(10px,env(safe-area-inset-left))}
 .bar{margin:0 0 6px;gap:6px 8px}
 .bar .grp{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;width:100%;padding-bottom:2px}
 .bar .grp::-webkit-scrollbar{display:none}
 .bar .lbl{white-space:nowrap;font-size:12px}
 .bar button{white-space:nowrap;font-size:13.5px;padding:8px 13px;min-height:40px;flex-shrink:0}
 .bar label{font-size:13.5px;min-height:38px;white-space:nowrap}
 .touch-hint{display:block}
}
@media (max-width:900px) and (orientation:portrait){
 .svg-stage{height:46vh;height:clamp(300px,48vh,470px);min-height:280px;border:1.5px solid #E2E7F0}
 .svg-stage svg{width:100%;height:100%;display:block}
 #info{margin-top:8px;padding:12px 14px;min-height:120px}
 #info h2{font-size:16px}
 #info p,#info ul,#info .sample{font-size:14px}
}
@media (max-width:950px) and (orientation:landscape) and (max-height:540px){
 .wrap{padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));max-width:100%}
 .controls-wrap{flex-direction:row;align-items:center;gap:8px;margin-bottom:6px}
 .controls-wrap .bar{margin:0;flex-shrink:0}
 .controls-wrap .bar:last-child{flex:1;min-width:0}
 .bar label{font-size:12.5px;min-height:34px;padding:0 4px;gap:5px}
 .bar input{width:17px;height:17px}
 .bar .lbl{display:none}
 .bar button{font-size:12.5px;padding:6px 11px;min-height:34px}
 .main-split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,1fr);grid-template-rows:minmax(0,1fr);gap:8px;height:calc(100vh - 54px);height:calc(100svh - 54px);min-height:230px;max-height:480px;align-items:stretch}
 .svg-stage{height:100%;min-height:220px;border:1.5px solid #E2E7F0}
 .svg-stage svg{width:100%;height:100%;display:block}
 .zoom-hud{right:6px;bottom:6px;padding:3px;gap:4px}
 .zoom-hud button{min-width:30px;height:30px;font-size:12px;padding:0 8px}
 .touch-hint{display:none}
 #info{margin-top:0;height:100%;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px}
 #info h2{font-size:15px}
 #info p,#info ul,#info .sample{font-size:13px;line-height:1.42}
 #info ul{columns:1;margin-top:6px}
}
@media (max-width:760px){#info ul{columns:1}}
@media (prefers-reduced-motion:reduce){[data-flows]{transition:none}}
</style>
</head>

 });

var stage=document.getElementById('stage');
var FULL_VB={x:0,y:0,w:1280,h:820};
var PORTRAIT_STEP_VB={
 0:{x:0,y:0,w:1280,h:820},
 1:{x:28,y:128,w:764,h:554},
 2:{x:28,y:128,w:764,h:554},
 3:{x:28,y:128,w:764,h:554},
 4:{x:32,y:132,w:1224,h:550}
};
var curVB={x:0,y:0,w:1280,h:820};
var animRaf=null;
var mqMobile=window.matchMedia?window.matchMedia('(max-width: 900px)'):{matches:false};
var mqPortrait=window.matchMedia?window.matchMedia('(max-width: 900px) and (orientation: portrait)'):{matches:false};
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function setVB(vb){
 curVB={x:vb.x,y:vb.y,w:vb.w,h:vb.h};
 svg.setAttribute('viewBox',curVB.x.toFixed(1)+' '+curVB.y.toFixed(1)+' '+curVB.w.toFixed(1)+' '+curVB.h.toFixed(1));
 stage.classList.toggle('zoomed',curVB.w<1275||curVB.h<815);
}
function animateVB(target,instant){
 if(animRaf){cancelAnimationFrame(animRaf);animRaf=null;}
 if(instant||reduceMotion){setVB(target);return;}
 var start={x:curVB.x,y:curVB.y,w:curVB.w,h:curVB.h};
 var t0=performance.now(),dur=320;
 function tick(now){
  var p=Math.min(1,(now-t0)/dur);
  var e=1-Math.pow(1-p,3);
  setVB({
   x:start.x+(target.x-start.x)*e,
   y:start.y+(target.y-start.y)*e,
   w:start.w+(target.w-start.w)*e,
   h:start.h+(target.h-start.h)*e
  });
  if(p<1){animRaf=requestAnimationFrame(tick);}else{animRaf=null;}
 }
 animRaf=requestAnimationFrame(tick);
}
function getDefaultVB(){
 var isPort=mqPortrait.matches||(window.innerWidth<=900&&window.innerHeight>window.innerWidth);
 if(isPort){
  return PORTRAIT_STEP_VB[st.step]||FULL_VB;
 }
 return FULL_VB;
}
function syncViewportMode(instant){
 stage.classList.toggle('is-mobile',mqMobile.matches);
 animateVB(getDefaultVB(),instant);
}
function clampVB(vb){
 var w=Math.max(360,Math.min(1280,vb.w));
 var h=w*(820/1280);
 var x=Math.max(-40,Math.min(1280-w+40,vb.x));
 var y=Math.max(-30,Math.min(820-h+30,vb.y));
 return {x:x,y:y,w:w,h:h};
}
function zoomBy(factor,cxRatio,cyRatio){
 var rx=(cxRatio===undefined)?0.5:cxRatio;
 var ry=(cyRatio===undefined)?0.5:cyRatio;
 var nw=curVB.w*factor;
 var nh=curVB.h*factor;
 var next=clampVB({
  x:curVB.x+(curVB.w-nw)*rx,
  y:curVB.y+(curVB.h-nh)*ry,
  w:nw,
  h:nh
 });
 animateVB(next,false);
}

document.getElementById('z-in').addEventListener('click',function(){zoomBy(0.75);});
document.getElementById('z-out').addEventListener('click',function(){zoomBy(1.333);});
document.getElementById('z-fit').addEventListener('click',function(){animateVB(getDefaultVB(),false);});

// Pointer + Touch pan & pinch-to-zoom on stage
var ptrs=new Map();
var gesture=null;
var suppressClick=false;
if(!window.PointerEvent){
 var tGesture=null;
 stage.addEventListener('touchstart',function(e){
  if(e.target.closest('.zoom-hud'))return;
  if(e.touches.length===1){
   tGesture={type:'pan',startX:e.touches[0].clientX,startY:e.touches[0].clientY,startVB:{x:curVB.x,y:curVB.y,w:curVB.w,h:curVB.h},moved:false};
  }else if(e.touches.length===2){
   var d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY)||1;
   var mx=(e.touches[0].clientX+e.touches[1].clientX)/2;
   var my=(e.touches[0].clientY+e.touches[1].clientY)/2;
   tGesture={type:'pinch',startDist:d,midX:mx,midY:my,startVB:{x:curVB.x,y:curVB.y,w:curVB.w,h:curVB.h}};
   suppressClick=true;
  }
 },{passive:true});
 stage.addEventListener('touchmove',function(e){
  if(!tGesture)return;
  var rect=stage.getBoundingClientRect();
  if(!rect.width||!rect.height)return;
  if(tGesture.type==='pan'&&e.touches.length===1){
   var dx=e.touches[0].clientX-tGesture.startX;
   var dy=e.touches[0].clientY-tGesture.startY;
   if(!tGesture.moved&&Math.hypot(dx,dy)<6)return;
   tGesture.moved=true;suppressClick=true;
   var sc=Math.max(tGesture.startVB.w/rect.width,tGesture.startVB.h/rect.height);
   setVB(clampVB({x:tGesture.startVB.x-dx*sc,y:tGesture.startVB.y-dy*sc,w:tGesture.startVB.w,h:tGesture.startVB.h}));
  }else if(tGesture.type==='pinch'&&e.touches.length===2){
   var d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY)||1;
   var ratio=tGesture.startDist/d;
   var mx=(e.touches[0].clientX+e.touches[1].clientX)/2;
   var my=(e.touches[0].clientY+e.touches[1].clientY)/2;
   var rx=Math.max(0,Math.min(1,(mx-rect.left)/rect.width));
   var ry=Math.max(0,Math.min(1,(my-rect.top)/rect.height));
   var nw=tGesture.startVB.w*ratio,nh=tGesture.startVB.h*ratio;
   setVB(clampVB({x:tGesture.startVB.x+(tGesture.startVB.w-nw)*rx,y:tGesture.startVB.y+(tGesture.startVB.h-nh)*ry,w:nw,h:nh}));
  }
 },{passive:true});
 stage.addEventListener('touchend',function(){tGesture=null;setTimeout(function(){suppressClick=false;},40);});
}
stage.addEventListener('pointerdown',function(e){
 if(e.target.closest('.zoom-hud'))return;
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1){
  gesture={type:'pan',startX:e.clientX,startY:e.clientY,startVB:{x:curVB.x,y:curVB.y,w:curVB.w,h:curVB.h},moved:false};
 }else if(ptrs.size===2){
  var pts=Array.from(ptrs.values());
  var dist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y)||1;
  var midX=(pts[0].x+pts[1].x)/2;
  var midY=(pts[0].y+pts[1].y)/2;
  gesture={type:'pinch',startDist:dist,midX:midX,midY:midY,startVB:{x:curVB.x,y:curVB.y,w:curVB.w,h:curVB.h}};
  suppressClick=true;
 }
});
stage.addEventListener('pointermove',function(e){
 if(!ptrs.has(e.pointerId)||!gesture)return;
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 var rect=stage.getBoundingClientRect();
 if(!rect.width||!rect.height)return;
 if(gesture.type==='pan'&&ptrs.size===1){
  var dx=e.clientX-gesture.startX;
  var dy=e.clientY-gesture.startY;
  if(!gesture.moved&&Math.hypot(dx,dy)<6)return;
  if(!gesture.moved){
   gesture.moved=true;
   suppressClick=true;
   stage.classList.add('is-dragging');
   if(animRaf){cancelAnimationFrame(animRaf);animRaf=null;}
  }
  var scaleX=gesture.startVB.w/rect.width;
  var scaleY=gesture.startVB.h/rect.height;
  var scale=Math.max(scaleX,scaleY);
  setVB(clampVB({
   x:gesture.startVB.x-dx*scale,
   y:gesture.startVB.y-dy*scale,
   w:gesture.startVB.w,
   h:gesture.startVB.h
  }));
 }else if(gesture.type==='pinch'&&ptrs.size===2){
  if(animRaf){cancelAnimationFrame(animRaf);animRaf=null;}
  var pts=Array.from(ptrs.values());
  var dist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y)||1;
  var ratio=gesture.startDist/dist;
  var midX=(pts[0].x+pts[1].x)/2;
  var midY=(pts[0].y+pts[1].y)/2;
  var rx=Math.max(0,Math.min(1,(midX-rect.left)/rect.width));
  var ry=Math.max(0,Math.min(1,(midY-rect.top)/rect.height));
  var nw=gesture.startVB.w*ratio;
  var nh=gesture.startVB.h*ratio;
  var panDx=(midX-gesture.midX)*(gesture.startVB.w/rect.width);
  var panDy=(midY-gesture.midY)*(gesture.startVB.h/rect.height);
  setVB(clampVB({
   x:gesture.startVB.x+(gesture.startVB.w-nw)*rx-panDx,
   y:gesture.startVB.y+(gesture.startVB.h-nh)*ry-panDy,
   w:nw,
   h:nh
  }));
 }
});
function resetPointers(){

function endPointer(e){

 }
}
stage.addEventListener('pointerup',endPointer);
stage.addEventListener('pointercancel',endPointer);

document.querySelectorAll('[data-step]').forEach(function(b){
 b.addEventListener('click',function(){
  var n=Number(b.getAttribute('data-step'));
  st.step=(st.step===n)?0:n;
  if(st.step>0){st.key=null;st.nodeEl=null;}
  update();
  animateVB(getDefaultVB(),false);
  var activeBtn=document.querySelector('[data-step="'+st.step+'"]');
  if(activeBtn&&activeBtn.scrollIntoView){
   activeBtn.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'nearest',inline:'center'});
  }
 });
});
var core=document.getElementById('core');
core.addEventListener('change',function(){
 svg.classList.toggle('core-off',!core.checked);
 if(!core.checked){if(st.step>=3){st.step=0;}if(st.nodeEl&&st.nodeEl.classList.contains('core-el')){st.key=null;st.nodeEl=null;}}
 update();
 animateVB(getDefaultVB(),false);
});
var an=document.getElementById('anim');
function syncSvgSmil(){
 var shouldRun=an.checked&&!document.hidden;
 try{
  if(shouldRun&&svg.unpauseAnimations){svg.unpauseAnimations();}
  else if(!shouldRun&&svg.pauseAnimations){svg.pauseAnimations();}
 }catch(err){}
}
function setAnim(){
 svg.classList.toggle('no-anim',!an.checked);
 syncSvgSmil();
}
an.addEventListener('change',setAnim);
if(reduceMotion){an.checked=false;}
if(mqMobile.addEventListener){
 mqMobile.addEventListener('change',function(){syncViewportMode(true);});
 mqPortrait.addEventListener('change',function(){syncViewportMode(true);});
}else{
 window.addEventListener('resize',function(){syncViewportMode(true);});
}
document.addEventListener('visibilitychange',function(){
 syncSvgSmil();
 if(!document.hidden){
  syncViewportMode(true);
  stage.style.transform='translateZ(0)';
  requestAnimationFrame(function(){stage.style.transform='';});
 }
});
window.addEventListener('pageshow',function(){
 syncSvgSmil();
 syncViewportMode(true);
});
setAnim();update();syncViewportMode(true);
})();
</script>
</body>
</html>
